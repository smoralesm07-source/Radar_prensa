[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-prensa"
version = "0.4.0"
description = "Radar OSINT de prensa contextual, longitudinal e interoperable con resolución de identidad gobernada"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
radar-prensa = "radar_prensa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
